[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "email-marketing-platform-backend"
version = "0.1.0"
description = "Email marketing platform API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042: pre-existing `class X(str, enum.Enum)` pattern across app/*/models.py pairs with
# pg_enum()'s values_callable; migrating to enum.StrEnum is a separate, deliberate change.
# B008: FastAPI's `Depends(...)` is meant to be called in argument defaults.
ignore = ["UP042", "B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
